name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infinyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infinyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infinyx_test?sslmode=disable
      INFINYX_TEST_DATABASE_URL: postgresql://infinyx_app:ci-only-password@localhost:5432/infinyx_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Create a short-lived local TLS certificate for Keycloak
        run: |
          mkdir -p .ci/keycloak
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout .ci/keycloak/server.key \
            -out .ci/keycloak/server.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          # The official Keycloak image runs as UID 1000 (GID 0); grant it read access
          # without making the private key world-readable on the runner.
          sudo chown 1000:0 .ci/keycloak/server.key .ci/keycloak/server.crt
          chmod 640 .ci/keycloak/server.key
          chmod 644 .ci/keycloak/server.crt
          echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/.ci/keycloak/server.crt" >> "$GITHUB_ENV"
          echo "KEYCLOAK_INTEGRATION_ISSUER=https://localhost:8443/realms/infinyx-ci" >> "$GITHUB_ENV"
      - name: Start isolated Keycloak test realm over HTTPS
        run: |
          docker run --detach --name infinyx-keycloak \
            --publish 8443:8443 \
            --volume "$GITHUB_WORKSPACE/.ci/keycloak:/opt/keycloak/conf/tls:ro" \
            --volume "$GITHUB_WORKSPACE/.github/keycloak/infinyx-ci-realm.json:/opt/keycloak/data/import/infinyx-ci-realm.json:ro" \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-admin-password \
            --env KC_HOSTNAME=https://localhost:8443 \
            --env KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/conf/tls/server.crt \
            --env KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/conf/tls/server.key \
            quay.io/keycloak/keycloak:26.3.3 start-dev --https-port=8443 --import-realm
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --cacert .ci/keycloak/server.crt \
              https://localhost:8443/realms/infinyx-ci/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs infinyx-keycloak
          exit 1
      - name: Create least-privilege application role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE infinyx_app LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - name: Apply database migrations
        run: npm run db:migrate:up
      - name: Grant application table privileges and seed isolated tenants
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO infinyx_app;
          GRANT SELECT, INSERT ON users, user_external_identities TO infinyx_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON web_sessions TO infinyx_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON web_login_transactions TO infinyx_app;
          GRANT SELECT, INSERT ON tenants, tenant_memberships TO infinyx_app;
          GRANT DELETE ON tenants TO infinyx_app;
          GRANT UPDATE ON tenants TO infinyx_app;
          GRANT UPDATE (status, status_changed_at, status_changed_by, status_change_correlation_id, version) ON tenant_memberships TO infinyx_app;
          GRANT SELECT, INSERT ON tenant_membership_audit_events TO infinyx_app;
          GRANT SELECT, INSERT ON tenant_invitations TO infinyx_app;
          GRANT UPDATE (status, accepted_by, accepted_at, revoked_by, revoked_at, version) ON tenant_invitations TO infinyx_app;
          GRANT SELECT, INSERT ON tenant_invitation_audit_events TO infinyx_app;
          GRANT SELECT, INSERT ON tenant_invitation_delivery_outbox TO infinyx_app;
          GRANT UPDATE (status, attempts, next_attempt_at, sent_at) ON tenant_invitation_delivery_outbox TO infinyx_app;
          GRANT EXECUTE ON FUNCTION lookup_tenant_for_invitation_token(bytea) TO infinyx_app;
          INSERT INTO users (id) VALUES
            ('10000000-0000-4000-8000-000000000001'),
            ('10000000-0000-4000-8000-000000000002');
          INSERT INTO user_external_identities (user_id, issuer, subject) VALUES
            ('10000000-0000-4000-8000-000000000001', 'https://infinyx.integration.test', 'user-tenant-a'),
            ('10000000-0000-4000-8000-000000000002', 'https://infinyx.integration.test', 'user-tenant-b');
          INSERT INTO tenants (id, name) VALUES
            ('tenant-a', 'Tenant A'),
            ('tenant-b', 'Tenant B'),
            ('tenant-c', 'Tenant C');
          INSERT INTO tenant_memberships (tenant_id, user_id, internal_user_id, role) VALUES
            ('tenant-a', '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', 'owner'),
            ('tenant-b', '10000000-0000-4000-8000-000000000002', '10000000-0000-4000-8000-000000000002', 'owner'),
            ('tenant-c', '10000000-0000-4000-8000-000000000001', '10000000-0000-4000-8000-000000000001', 'manager');
          SQL
      - name: Check migration file syntax
        run: npm run db:migrate:check
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities ?? {}; console.log(JSON.stringify({metadata:v, vulnerabilities:Object.entries(a.vulnerabilities ?? {}).map(([name,x])=>({name,severity:x.severity,isDirect:x.isDirect,range:x.range,fixAvailable:x.fixAvailable,via:x.via}))},null,2)); if ((v.total ?? 0) > 0) process.exit(1)'
      - name: Typecheck
        run: npm run typecheck
      - name: Build Web BFF runtime
        run: npm run build
      - name: Run unit and PostgreSQL integration tests
        run: npm test
      - name: Verify live Keycloak discovery and JWKS over HTTPS
        env:
          KEYCLOAK_INTEGRATION_CLIENT_ID: infinyx-web
          KEYCLOAK_INTEGRATION_CLIENT_SECRET: ci-only-infinyx-web-secret
        run: npm run test:keycloak
      - name: Stop Keycloak test realm
        if: always()
        run: docker rm --force infinyx-keycloak || true
