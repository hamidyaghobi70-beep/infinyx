name: CI

on:
  push:
    branches:
      - foundation/repository-foundation
  pull_request:
    branches:
      - foundation/repository-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record runtime versions
        shell: bash
        run: |
          {
            echo "### Verification runtime"
            echo "- Node.js: $(node --version)"
            echo "- npm: $(npm --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
