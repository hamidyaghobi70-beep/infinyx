name: Bootstrap Lockfile

on:
  push:
    branches:
      - foundation/repository-foundation

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Foundation branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record runtime versions
        shell: bash
        run: |
          {
            echo "### Bootstrap runtime"
            echo "- Node.js: $(node --version)"
            echo "- npm: $(npm --version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Validate package-lock.json
        shell: bash
        run: |
          test -s package-lock.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            if (!Number.isInteger(lock.lockfileVersion) || lock.lockfileVersion < 1) {
              throw new Error("Missing or unsupported lockfileVersion");
            }
            if (!lock.packages || !lock.packages[""]) {
              throw new Error("Lockfile is missing the root package entry");
            }
            if (lock.name !== pkg.name || lock.version !== pkg.version) {
              throw new Error("Lockfile root name/version does not match package.json");
            }
            if (lock.packages[""].name !== pkg.name || lock.packages[""].version !== pkg.version) {
              throw new Error("Lockfile root package entry does not match package.json");
            }
            console.log("package-lock.json is valid JSON and its root metadata matches package.json");
            console.log("lockfileVersion:", lock.lockfileVersion);
          '

      - name: Calculate SHA-256
        id: lockfile_hash
        shell: bash
        run: |
          hash="$(sha256sum package-lock.json | awk '{print $1}')"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          {
            echo "- package-lock.json SHA-256: $hash"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload package-lock.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-json
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
