name: Core Engine v1

on:
  push:
    branches:
      - feature/core-engine-v1
      - fix/core-engine-shutdown-v4
      - fix/core-engine-shutdown-v5
      - fix/core-engine-shutdown-v6
  pull_request:
    branches:
      - foundation/repository-foundation
      - feature/core-engine-v1

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Record runtime
        run: |
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
      - name: Install exact lockfile
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Real process signal integration
        run: npm run test:process
      - name: Dependency security audit
        run: npm audit --audit-level=high
