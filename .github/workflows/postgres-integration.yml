name: PostgreSQL Integration

on:
  push:
    branches:
      - test/stage4-postgres-integration
  pull_request:
    branches:
      - fix/f01-f02-atomic-registration

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infinyx_test
          POSTGRES_PASSWORD: infinyx_test
          POSTGRES_DB: infinyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinyx_test -d infinyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://infinyx_test:infinyx_test@localhost:5432/infinyx_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Build migration runner
        run: npm run build
      - name: Install isolated integration-test driver
        run: |
          driver_dir="$RUNNER_TEMP/stage4-pg-driver"
          mkdir -p "$driver_dir"
          npm install --prefix "$driver_dir" --ignore-scripts --no-audit --no-fund pg@8.16.3
          ln -s "$driver_dir/node_modules/pg" node_modules/pg
      - name: Run real PostgreSQL integration checks
        run: node test/integration/postgres-migrations.integration.mjs
