name: Temporary PostgreSQL dependency security pin

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: write

jobs:
  pin-safe-migration-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin audited migration-tool version
        run: npm install --save-exact node-pg-migrate@7.6.1
      - name: Commit package manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'fix(deps): pin migration tool to audited version'
          git push origin HEAD:${GITHUB_REF_NAME}
