name: Temporary database dependency lockfile bootstrap
# Temporary: removed after dependency manifests are committed.

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and pin PostgreSQL dependencies
        run: |
          npm install --save-exact pg node-pg-migrate
          npm install --save-dev --save-exact @types/pg
      - name: Commit generated package manifests to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'chore(deps): add PostgreSQL driver and migration tooling'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload generated package manifests
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
