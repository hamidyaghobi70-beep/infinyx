name: Temporary database dependency lockfile bootstrap

on:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and pin PostgreSQL dependencies
        run: |
          npm install --save-exact pg node-pg-migrate
          npm install --save-dev --save-exact @types/pg
      - name: Upload generated package manifests
        uses: actions/upload-artifact@v4
        with:
          name: postgres-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
